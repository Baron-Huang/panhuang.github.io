name: Update Google Scholar statistics

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public Google Scholar metrics
        run: python scripts/fetch_scholar_stats.py
      - name: Commit refreshed metrics
        run: |
          if git diff --quiet -- data/scholar.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git commit -m "chore: refresh Google Scholar statistics"
          git push

