name: Update Google Scholar profile data # SerpApi sync refresh

on:
  push:
    paths:
      - "scripts/fetch_scholar_stats.py"
      - ".github/workflows/update-scholar-stats.yml"
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-profile-sync
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Google Scholar profile through SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/fetch_scholar_stats.py
      - name: Commit refreshed profile data
        run: |
          if git diff --quiet -- data/scholar.json data/publications.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json data/publications.json
          git commit -m "chore: refresh Google Scholar profile data"
          git pull --rebase origin main
          git push
